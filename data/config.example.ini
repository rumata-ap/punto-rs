; Пример конфигурации punto-rs.
; Скопировать в ~/.config/punto-rs/config.ini (или указать PUNTO_CONFIG).

[general]
max_word_len = 32
detect_passwords = true
dont_convert_capitals = false

; VK-код ручной конвертации последнего слова.
; 70 = ScrollLock, 19 = Pause/Break (как в Punto)
convert_hotkey = 70

; Команда смены раскладки на следующую. Варианты:
;   X11:      xkb-switch -n
;   GNOME:    gsettings set org.gnome.desktop.input-sources current 1
;   sway:     swaymsg input type:keyboard xkb_switch_layout next
switch_command = xkb-switch -n

[files]
dict = ~/.config/punto-rs/ru.dict
dict = ~/.config/punto-rs/en.dict
dict = ~/.config/punto-rs/wrong.dict
