; Пример конфигурации punto-rs.
; Скопировать в ~/.config/punto-rs/config.ini (или указать PUNTO_CONFIG).

[general]
max_word_len = 32
detect_passwords = true
dont_convert_capitals = false

; VK-код ручной конвертации последнего слова.
; 70 = ScrollLock, 19 = Pause/Break (как в Punto)
convert_hotkey = 70

; Команда смены раскладки на следующую. Варианты:
;   X11:      xkb-switch -n
;   GNOME:    gsettings set org.gnome.desktop.input-sources current 1
;   sway:     swaymsg input type:keyboard xkb_switch_layout next
switch_command = xkb-switch -n

; Точное переключение на нужную раскладку ({n} — индекс в layout_order).
; GNOME Wayland: g3kb-switch -s {n}   (нужно расширение GNOME Shell)
; KDE:           qdbus org.kde.keyboard /Layouts org.kde.KeyboardLayouts.setLayout {n}
layout_set_command =
; Чтение текущей раскладки (пусто = автопоиск).
layout_get_command =
layout_order = en,ru

; Источник «клавиша → символ»: static (встроенная таблица) или xkb
; (нужна сборка с --features xkb).
text_mapper = static

; Как вставлять исправленный текст: auto | uinput | clipboard | command.
;   uinput    — печать кодами клавиш (нужна верная раскладка)
;   clipboard — wl-copy + Ctrl+V через uinput (раскладка не важна)
;   command   — внешняя команда печати (wtype на sway/Hyprland)
output = auto
type_command = wtype {text}

[files]
dict = ~/.config/punto-rs/ru.dict
dict = ~/.config/punto-rs/en.dict
dict = ~/.config/punto-rs/wrong.dict
