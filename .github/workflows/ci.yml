name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev
      - name: core tests
        run: cargo test --all-targets
      - name: linux layer
        run: cargo check --features input-evdev
      - name: linux layer xkb
        run: cargo check --features input-evdev,xkb
      - name: release build
        run: cargo build --release --features input-evdev
      - name: doctor
        run: ./target/release/punto doctor
