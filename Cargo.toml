[package]
name = "punto-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Punto Switcher analog for Linux (Debian 13): automatic keyboard layout switching"
license = "MIT"

[features]
default = []
# чтение клавиатуры и инъекция ввода через /dev/input + /dev/uinput
input-evdev = ["dep:evdev"]
# раскладко-независимое преобразование клавиш через libxkbcommon
xkb = ["dep:xkbcommon"]
# иконка в системном трее (StatusNotifierItem) — режим `punto tray`.
# Требует более новый тулчейн, чем rust-version пакета.
tray = ["dep:ksni"]

[dependencies]
evdev = { version = "0.12", optional = true }
xkbcommon = { version = "0.7", optional = true }
# трей без GTK/libappindicator: StatusNotifierItem напрямую по D-Bus.
# blocking — синхронный API без tokio-рантайма в нашем коде.
ksni = { version = "0.3", optional = true, features = ["blocking"] }

[[bin]]
name = "punto"
path = "src/main.rs"

[profile.release]
opt-level = 2
lto = true
